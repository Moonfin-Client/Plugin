name: Auto-label type, area and server

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]

permissions:
  issues: write
  pull-requests: write

# Opening an issue fires "opened" alongside one "labeled" per label the form
# applies, so without this several runs reconcile the same labels at once.
concurrency:
  group: label-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply type, area and server labels
        uses: actions/github-script@v7
        with:
          script: |
            // Each section of the body is read on its own. Scanning the whole
            // body would match the option names the PR template prints next to
            // its unticked checkboxes, which puts every label on every PR.

            const target = context.payload.issue || context.payload.pull_request;
            const body = target.body || '';
            const number = target.number;

            const HEADING = /^\s{0,3}#{1,6}\s+(.*?)\s*#*\s*$/;
            const CHECKBOX = /^\s*(?:[-*+]\s*)?\[([ xX✓✔☑])\]\s*(.*)$/;

            function section(text, title) {
              const lines = text.split(/\r?\n/);
              let start = -1;
              for (let i = 0; i < lines.length; i++) {
                const m = lines[i].match(HEADING);
                if (m && title.test(m[1].trim())) {
                  start = i + 1;
                  break;
                }
              }
              if (start === -1) return null;
              const out = [];
              for (let i = start; i < lines.length; i++) {
                if (HEADING.test(lines[i])) break;
                out.push(lines[i]);
              }
              return out;
            }

            // Any checkbox at all means the section is a checkbox list, so an
            // unticked box is a no rather than a line to fall back on. Issue form
            // dropdowns have no boxes and print the answer as plain lines.
            function selected(lines) {
              const boxes = lines.map(l => l.match(CHECKBOX)).filter(Boolean);
              if (boxes.length) {
                return boxes.filter(m => m[1] !== ' ').map(m => m[2].trim());
              }
              return lines.map(l => l.trim()).filter(Boolean);
            }

            // The PR template offers this as a type of change and the issue form
            // as an area, so it belongs to both tables.
            const API_ENDPOINT = /\bAPI\s*\/\s*endpoint\b/i;

            const TYPES = [
              ['Bug', /\bBug\s*fix\b/i],
              ['Feature Request', /\bNew\s*feature\b/i],
              ['Refactor', /\bRefactor\b/i],
              ['Performance', /\bPerformance\b/i],
              ['API', API_ENDPOINT],
              ['Schema Change', /\bSettings\s*schema\b/i],
              ['documentation', /\bDocumentation\b/i],
              ['Build', /\bBuild\s*\/\s*CI\b/i]
            ];

            const AREAS = [
              ['Settings Sync', /\bSettings\s*sync\b/i],
              ['Config Page', /\b(Admin\s*defaults|Config\s*page)\b/i],
              ['Ratings', /\bRatings\b/i],
              ['Notifications', /\bNotifications\b/i],
              ['Seerr', /\bSeerr\b/i],
              ['Games', /\bGames\b/i],
              ['Home Rows', /\bhome\s*rows\b/i],
              ['Web Client', /\bWeb\s*Client\b/i],
              ['API', API_ENDPOINT]
            ];

            const SERVERS = [
              ['Jellyfin', /\bJellyfin\b/i],
              ['Emby', /\bEmby\b/i]
            ];

            const wanted = new Set();
            const managed = new Set();

            // A group is reconciled only when its own section is present, so a
            // pull request never clears the labels an issue form applied. "Other"
            // is dropped because it carries whatever the author typed after it,
            // which would otherwise match the categories by accident.
            function apply(table, items) {
              for (const [label] of table) managed.add(label);
              for (const item of items.filter(i => !/^other\b/i.test(i))) {
                for (const [label, regex] of table) {
                  if (regex.test(item)) wanted.add(label);
                }
              }
            }

            const typeLines = section(body, /^type of change\b/i);
            if (typeLines) apply(TYPES, selected(typeLines));

            const areaLines = section(body, /^area\b/i);
            if (areaLines) apply(AREAS, selected(areaLines));

            // "Both" on the feature request form gets both labels, so filtering by
            // either server still finds it.
            const serverLines = section(body, /^server$/i);
            if (serverLines) {
              const items = selected(serverLines);
              const both = items.some(i => /^both\b/i.test(i));
              apply(SERVERS, both ? ['Jellyfin', 'Emby'] : items);
            }

            if (!managed.size) {
              core.info('No Type of Change, Area or Server section found, leaving labels alone.');
              return;
            }

            const { data: existing } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100
            });
            const current = new Set(existing.map(l => l.name));

            const addLabels = [...wanted].filter(l => !current.has(l));
            const removeLabels = [...managed].filter(l => current.has(l) && !wanted.has(l));

            if (addLabels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                labels: addLabels
              });
            }

            for (const label of removeLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  name: label
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
